<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3038" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a252c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>LR Buddy</title>
    <!-- "Who am I" leaves with the page, not after the script: the exact URL tRPC's batch link asks for at boot. -->
    <link rel="preload" as="fetch" crossorigin="anonymous" href="/trpc/shared.me?batch=1&amp;input=%7B%220%22%3A%7B%22json%22%3Anull%2C%22meta%22%3A%7B%22values%22%3A%5B%22undefined%22%5D%2C%22v%22%3A1%7D%7D%7D" />
    <script>
      // Errors before the app boots (a module that throws on load): report them and show the
      // error panel instead of a blank page. After boot, web/src/lib/clientErrors.ts takes over.
      (function () {
        var sent = 0;
        function report(message, stack) {
          if (window.__lrbBooted || sent++ > 3) return;
          try {
            fetch("/client-error", {
              method: "POST",
              headers: { "content-type": "application/json" },
              credentials: "same-origin",
              keepalive: true,
              body: JSON.stringify({ message: String(message).slice(0, 1000), stack: stack || null, url: location.pathname + location.search, userAgent: navigator.userAgent, role: null }),
            }).catch(function () {});
          } catch (e) {}
        }
        function panel(message) {
          var root = document.getElementById("root");
          if (window.__lrbBooted || !root || root.querySelector("[data-error-panel]")) return;
          root.innerHTML =
            '<div class="grid min-h-full place-items-center bg-surface p-4 py-10 text-ink" role="alert" data-error-panel>' +
            '<div class="w-full max-w-md rounded-2xl bg-surface-2 p-4 ring-1 ring-line"><h2 class="text-lg font-bold">Screen failed</h2>' +
            '<p class="mt-2 font-mono text-sm break-words text-muted" data-error-message></p>' +
            '<div class="mt-4 flex gap-2"><button type="button" class="inline-flex min-h-11 items-center rounded-xl bg-brand px-4 font-semibold text-on-brand" data-reload>Reload</button></div></div></div>';
          root.querySelector("[data-error-message]").textContent = message;
          root.querySelector("[data-reload]").addEventListener("click", function () {
            location.reload();
          });
        }
        window.addEventListener("error", function (e) {
          if (window.__lrbBooted || (!e.error && !e.message)) return;
          var err = e.error;
          var message = err && err.message ? (err.name || "Error") + ": " + err.message : e.message;
          report(message, err && err.stack);
          panel(message);
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          report(r && r.message ? (r.name || "Error") + ": " + r.message : String(r), r && r.stack);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="grid h-dvh place-items-center" aria-busy="true">
        <span class="text-lg font-extrabold tracking-tight text-ink">LR Buddy</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
